<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradiox Gateway</title>
<style>
/* Gradiox Gateway: página local de la pasarela. Mismos colores que ops (--gx-n-* de src/app/ui.css), sin dependencias.
   Asistente de cuatro pasos hasta que todo funciona; después, panel con menú a la izquierda. */
:root{
  --fondo:#fcfcfd;--panel:#fff;--lado:#f7f8fa;--linea:#e4e5ea;--linea-f:#cdcfd8;--tinta:#1c2024;--gris:#5f636b;--tenue:#eeeff3;
  --sel:#e9ebfb;--acento:#4350d8;--acento-fondo:#eceefd;--acento-texto:#3a44c4;--sobre:#fff;
  --bien:#18794e;--bien-fondo:#e6f6eb;--aviso:#8a5300;--aviso-fondo:#fff1cc;--mal:#c4321c;--mal-fondo:#feebe7;
  --letra:"Onest",-apple-system,"Segoe UI",system-ui,sans-serif;--marca:"Outfit","Onest",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fondo:#111113;--panel:#18191b;--lado:#0c0c0f;--linea:#27292e;--linea-f:#3a3e45;--tinta:#edeef0;--gris:#a3a8b0;--tenue:#222428;
  --sel:#24263a;--acento:#9aa6ff;--acento-fondo:#23274f;--acento-texto:#b9c1ff;--sobre:#111113;
  --bien:#4cc38a;--bien-fondo:#11291e;--aviso:#f1c35a;--aviso-fondo:#33290f;--mal:#f0766e;--mal-fondo:#3b1614;color-scheme:dark}}
:root[data-theme="dark"]{
  --fondo:#111113;--panel:#18191b;--lado:#0c0c0f;--linea:#27292e;--linea-f:#3a3e45;--tinta:#edeef0;--gris:#a3a8b0;--tenue:#222428;
  --sel:#24263a;--acento:#9aa6ff;--acento-fondo:#23274f;--acento-texto:#b9c1ff;--sobre:#111113;
  --bien:#4cc38a;--bien-fondo:#11291e;--aviso:#f1c35a;--aviso-fondo:#33290f;--mal:#f0766e;--mal-fondo:#3b1614;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--fondo);color:var(--tinta);font:14px/1.5 var(--letra);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.marca{font-family:var(--marca);font-weight:600;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.marca i{display:inline-block;width:.48em;height:.48em;border:.12em solid var(--acento);border-radius:50%;margin:0 .03em;transform:translateY(-.22em)}

/* Barra de arriba: de quién es esta conexión (cliente en negrita, instalación debajo) y cómo va */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--linea);
  display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.producto{font-weight:600;font-size:14px;white-space:nowrap;line-height:1.2;display:flex;flex-direction:column}.producto{position:relative}.producto small{font-size:12px;font-weight:500;color:var(--gris);display:flex;align-items:center;gap:4px}
.info-btn{border:0;background:none;padding:0;width:18px;height:18px;display:grid;place-items:center;color:var(--gris);cursor:pointer;border-radius:50%}.info-btn:hover,.info-btn[aria-expanded="true"]{color:var(--acento);background:var(--acento-fondo)}.info-btn svg{width:14px;height:14px;stroke-width:1.9}
.info-pop{position:absolute;top:58px;left:max(16px,env(safe-area-inset-left,0px));z-index:30;width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--linea);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / .12);padding:12px 14px}.info-pop dl{margin:0;display:flex;flex-direction:column;gap:10px}.info-pop dt{font-size:12px;color:var(--gris);font-weight:600}.info-pop dd{margin:1px 0 0;font-weight:550}
.pie-fijo{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--linea);display:flex;gap:8px;align-items:baseline;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12.5px;color:var(--gris)}.pie-fijo b{color:var(--tinta);font-weight:600}
body{padding-bottom:44px}
.barra .sep{width:1px;align-self:stretch;background:var(--linea)}
.quien{min-width:0;line-height:1.25}
.quien b{display:flex;align-items:center;gap:6px;font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien span{display:flex;align-items:center;gap:6px;color:var(--gris);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien svg{flex:none;width:14px;height:14px;stroke-width:1.75}
.hueco{flex:1}
.pastilla{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:550;background:var(--tenue);color:var(--gris);white-space:nowrap}
.pastilla::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pastilla.bien{background:var(--bien-fondo);color:var(--bien)}.pastilla.aviso{background:var(--aviso-fondo);color:var(--aviso)}.pastilla.mal{background:var(--mal-fondo);color:var(--mal)}.pastilla.acento{background:var(--acento-fondo);color:var(--acento-texto)}
.pastilla.sin::before{display:none}

/* Botones y campos (forma de shadcn) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--linea-f);background:var(--panel);font-weight:550;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--tenue)}
.btn.prim{background:var(--acento);border-color:var(--acento);color:var(--sobre)}
.btn.prim:hover{filter:brightness(1.07)}
.btn.grande{height:42px;padding:0 18px;font-size:15px}
.btn.fant{border-color:transparent;background:none;color:var(--gris)}
.btn.fant:hover{background:var(--tenue);color:var(--tinta)}
.btn.peligro{color:var(--mal)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn svg{width:16px;height:16px;stroke-width:1.75}
.enlace{background:none;border:0;padding:0;color:var(--acento-texto);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:500}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-weight:550;font-size:13.5px}
.campo small{color:var(--gris);font-size:13px}
.entrada{height:38px;border:1px solid var(--linea-f);border-radius:var(--r);background:var(--panel);padding:0 12px;width:100%}
.entrada.mono{font-family:var(--mono)}
.codigo{font-family:var(--mono);font-size:26px;letter-spacing:.08em;word-spacing:-.25em;text-align:center;height:52px;width:200px;max-width:100%;padding:0 10px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rejilla2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.rejilla2{grid-template-columns:1fr}}
.nota{color:var(--gris);font-size:13px}
.tarjeta{background:var(--panel);border:1px solid var(--linea);border-radius:12px}

/* Asistente: un paso a la vista */
.asistente{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;padding-block:36px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:800px){.asistente{grid-template-columns:1fr;gap:18px;padding-block:20px 80px}}
.pasos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:90px;align-self:start}
.pasos li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r);color:var(--gris);font-weight:500}
.pasos li .n{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--linea-f);display:grid;place-items:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pasos li.ahora{background:var(--sel);color:var(--tinta)}
.pasos li.ahora .n{background:var(--acento);border-color:var(--acento);color:var(--sobre)}
.pasos li.hecho .n{background:var(--bien-fondo);border-color:transparent;color:var(--bien)}
.pasos li.hecho{color:var(--tinta)}
.pasos li.ayuda-pasos{display:block;margin-top:14px;padding:0 10px;font-size:13px;color:var(--gris)}
@media (max-width:800px){
  .pasos{position:static;flex-direction:row;gap:6px}
  .pasos li{flex:1;flex-direction:column;gap:4px;padding:6px 2px;font-size:12px;text-align:center;background:none!important}
  .pasos li .t{display:none}.pasos li.ahora .t{display:block}
  .pasos li.ayuda-pasos{display:none}
  .barra .sep,.barra .pastilla.sin{display:none}
}
.paso{min-width:0;max-width:640px}
.paso .eyebrow{font-size:12.5px;font-weight:600;color:var(--acento-texto);letter-spacing:.03em;text-transform:uppercase}
.paso h1{font-size:24px;font-weight:650;letter-spacing:-.015em;margin:6px 0 8px}
.paso .intro{color:var(--gris);font-size:15px;margin:0 0 24px;max-width:58ch}
.paso .bloque{display:flex;flex-direction:column;gap:18px}
.pie-paso{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--linea)}

.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opciones{grid-template-columns:1fr}}
.opcion{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--linea-f);border-radius:10px;background:var(--panel);cursor:pointer}
.opcion svg{flex:none;width:22px;height:22px;stroke-width:1.55;color:var(--gris);margin-top:1px}
.opcion b{display:block;font-weight:600}
.opcion span{display:block;color:var(--gris);font-size:13px;margin-top:2px}
.opcion[aria-pressed="true"]{border-color:var(--acento);background:var(--acento-fondo)}
.opcion[aria-pressed="true"] svg{color:var(--acento)}

.aviso{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:10px;border:1px solid var(--linea);background:var(--lado)}
.aviso>svg{flex:none;width:19px;height:19px;stroke-width:1.75;margin-top:1px}
.aviso b{display:block;font-weight:600}
.aviso p{margin:4px 0 0;color:var(--gris)}
.aviso.bien{background:var(--bien-fondo);border-color:transparent}.aviso.bien>svg{color:var(--bien)}
.aviso.mal{background:var(--mal-fondo);border-color:transparent}.aviso.mal>svg{color:var(--mal)}
.aviso.ambar{background:var(--aviso-fondo);border-color:transparent}.aviso.ambar>svg{color:var(--aviso)}
.aviso.acento{background:var(--acento-fondo);border-color:transparent}.aviso.acento>svg{color:var(--acento)}
.aviso .cuerpo{min-width:0;flex:1}
.aviso ol{margin:8px 0 0;padding-left:20px;color:var(--tinta)}
.aviso ol li{margin:3px 0}
.aviso code,.mono-t{font-family:var(--mono);font-size:12.5px;background:var(--tenue);padding:1px 5px;border-radius:4px}
.aviso .fila{margin-top:12px}
details.mas>summary{cursor:pointer;color:var(--gris);font-weight:550;list-style:none;display:flex;gap:6px;align-items:center}
details.mas>summary::-webkit-details-marker{display:none}
details.mas>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details.mas[open]>summary::before{transform:rotate(45deg)}
details.mas>div{margin-top:14px}

.interruptor{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.interruptor input{appearance:none;flex:none;width:34px;height:20px;border-radius:999px;background:var(--linea-f);position:relative;cursor:pointer;margin:1px 0 0;transition:background .15s}
.interruptor input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.interruptor input:checked{background:var(--acento)}
.interruptor input:checked::after{transform:translateX(14px)}
.interruptor b{display:block;font-weight:550}
.interruptor span{color:var(--gris);font-size:13px}

.giro{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:giro .7s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:2s}}

/* Elegir variables */
.resumen-lista{display:flex;gap:16px;align-items:center;padding:18px;flex-wrap:wrap}
.resumen-lista .cifra{font-size:30px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.resumen-lista .cifra small{font-size:15px;color:var(--gris);font-weight:500}
.resumen-lista .txt{flex:1 1 240px;min-width:0}
.explorador{display:flex;flex-direction:column;min-height:0}
.explorador .herr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;border-bottom:1px solid var(--linea)}
.explorador .herr .entrada{flex:1 1 200px;height:34px}
.segm{display:inline-flex;border:1px solid var(--linea-f);border-radius:var(--r);overflow:hidden}
.segm button{border:0;background:none;padding:0 11px;height:32px;font-size:13px;font-weight:550;color:var(--gris);cursor:pointer}
.segm button[aria-pressed="true"]{background:var(--sel);color:var(--tinta)}
.arbol{max-height:440px;overflow:auto}
.nodo{display:grid;grid-template-columns:24px 22px minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--linea);min-height:40px}
.nodo:last-child{border-bottom:0}
.nodo .ab{border:0;background:none;padding:0;width:22px;height:22px;display:grid;place-items:center;cursor:pointer;color:var(--gris);border-radius:4px}
.nodo .ab:hover{background:var(--tenue)}
.nodo .ab svg{width:15px;height:15px;stroke-width:2;transition:transform .12s}
.nodo .ab[aria-expanded="true"] svg{transform:rotate(90deg)}
.nodo input[type=checkbox]{width:16px;height:16px;accent-color:var(--acento);margin:0}
.nodo .nom{min-width:0}
.nodo .nom b{font-weight:550;display:block;overflow-wrap:anywhere}
.nodo .nom code{font-family:var(--mono);font-size:12px;color:var(--gris);overflow-wrap:anywhere}
.nodo .nom .det{font-size:12.5px;color:var(--gris)}
.nodo .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.nodo.carpeta{background:var(--lado)}
.nodo.carpeta .nom b{font-weight:600}
.nodo.hijo{padding-left:36px}.nodo.nieto{padding-left:60px}
.etq{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--acento-fondo);color:var(--acento-texto);margin-left:6px;vertical-align:1px}
.etq.gris{background:var(--tenue);color:var(--gris)}
.pie-explorador{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border-top:1px solid var(--linea);background:var(--panel);border-radius:0 0 12px 12px}

/* Comprobación */
.compro{display:flex;flex-direction:column}
.compro .it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:14px 16px;border-bottom:1px solid var(--linea);align-items:start}
.compro .it:last-child{border-bottom:0}
.compro .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tenue);color:var(--gris)}
.compro .ic svg{width:16px;height:16px;stroke-width:2.2}
.compro .it.ok .ic{background:var(--bien-fondo);color:var(--bien)}
.compro .it.mal .ic{background:var(--aviso-fondo);color:var(--aviso)}
.compro b{font-weight:600}
.compro p{margin:2px 0 0;color:var(--gris);font-size:13.5px}

/* Panel en marcha */
.armazon{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 61px)}
.lado{background:var(--lado);border-right:1px solid var(--linea);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.lado button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r);color:var(--gris);font-weight:550;cursor:pointer}
.lado button svg{width:18px;height:18px;stroke-width:1.6;flex:none}
.lado button:hover{background:var(--tenue);color:var(--tinta)}
.lado button[aria-current="true"]{background:var(--sel);color:var(--tinta)}
.lado .cuenta{margin-left:auto;font-size:12px;font-weight:600;background:var(--aviso-fondo);color:var(--aviso);border-radius:999px;padding:0 7px}
.lado .grupo{font-size:12px;font-weight:600;color:var(--gris);padding:14px 10px 4px;letter-spacing:.03em;text-transform:uppercase}
.contenido{min-width:0;padding-block:28px 80px;padding-left:max(16px,min(40px,4vw));padding-right:max(16px,env(safe-area-inset-right,0px))}
.contenido .ancho{max-width:860px}
.titulo-sec{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.titulo-sec h1{font-size:22px;font-weight:650;letter-spacing:-.015em}
.titulo-sec p{margin:4px 0 0;color:var(--gris);max-width:62ch}
@media (max-width:800px){
  .armazon{grid-template-columns:1fr}
  .lado{flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--linea);gap:4px;position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:4;align-items:center;align-self:start}
  .lado .grupo{display:none}
  .lado button{width:auto;white-space:nowrap;padding:7px 10px}
  .lado button svg{display:none}
  .contenido{padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px))}
}
.estado-grande{display:flex;gap:16px;align-items:center;padding:20px;flex-wrap:wrap}
.estado-grande .punto{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bien-fondo);color:var(--bien)}
.estado-grande .punto svg{width:22px;height:22px;stroke-width:2}
.estado-grande.mal .punto{background:var(--aviso-fondo);color:var(--aviso)}
.estado-grande h2{font-size:19px;font-weight:650}
.estado-grande p{margin:2px 0 0;color:var(--gris)}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:900px){.tres{grid-template-columns:1fr}}
.dato{padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dato .cab{display:flex;gap:8px;align-items:center;color:var(--gris);font-weight:550;font-size:13px}
.dato .cab svg{width:16px;height:16px;stroke-width:1.75}
.dato .cifra{font-size:22px;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dato .cifra small{font-size:13px;color:var(--gris);font-weight:500}
.dato p{margin:0;color:var(--gris);font-size:13px;overflow-wrap:anywhere}
.lista-pend{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.lista-pend h3{font-size:14px;font-weight:600;color:var(--gris)}
.tabla-env{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:550;color:var(--gris);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--linea);white-space:nowrap;background:var(--lado)}
td{padding:9px 12px;border-bottom:1px solid var(--linea);vertical-align:top}
tr:last-child td{border-bottom:0}
td.v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
th.v{text-align:right}
td code{font-family:var(--mono);font-size:12px;color:var(--gris);overflow-wrap:anywhere}
tr.sep td{background:var(--lado);font-weight:600;font-size:12.5px;color:var(--gris);padding:7px 12px}
td.falta{color:var(--aviso)}
.def{display:grid;grid-template-columns:minmax(140px,200px) minmax(0,1fr);gap:0}
.def>div{padding:11px 16px;border-bottom:1px solid var(--linea)}
.def>div:nth-last-child(-n+2){border-bottom:0}
.def .k{color:var(--gris)}
@media (max-width:560px){.def{grid-template-columns:1fr}.def .k{padding-bottom:0;border-bottom:0}}
.cab-tarjeta{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.cab-tarjeta h2{font-size:15px;font-weight:600}
.cab-tarjeta svg{width:19px;height:19px;stroke-width:1.55;color:var(--gris)}
.pila{display:flex;flex-direction:column;gap:14px}
.registro{font:12.5px/1.6 var(--mono);color:var(--gris);white-space:pre-wrap;max-height:220px;overflow:auto;margin:0;padding:14px 16px}
td .pastilla{display:inline-flex;vertical-align:middle}td.quien-col{width:1%;white-space:nowrap}
@media (max-width:560px){.barra .producto,.barra .producto small{font-size:0}.info-btn{width:24px;height:24px}}
@media (max-width:560px){.barra .quien{flex:1 1 auto}.barra .hueco{display:none}.barra .pastilla:not(.sin){font-size:0;gap:0;padding:6px}.barra .pastilla::before{width:9px;height:9px}}
.cifra-g{font-size:34px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.confirmar{margin-top:12px}

/* Mandos de la maqueta: no forman parte del programa */

/* Variables: ver y probar en la misma lista */
.vars-cab{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--linea)}
.vars-cab #pvbusca{flex:1 1 220px;max-width:360px}
.vuelta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris);flex-wrap:wrap}.vuelta select{width:auto;height:32px;padding:0 8px;font-size:13px}
.var{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--linea)}
.var:last-child{border-bottom:0}
.var-nom{all:unset;cursor:pointer;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.var-nom b{font-weight:550;font-size:14px;overflow-wrap:anywhere}
.var-nom code{flex-basis:100%;font-family:var(--mono);font-size:12px;color:var(--gris);overflow-wrap:anywhere}
.var-nom:focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:4px}
.var-val{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.var-val.falta{color:var(--gris);font-weight:500}
.var-ctrl{display:flex;justify-content:flex-end}
.var-nota,.var-mas{grid-column:1/-1;font-size:12.5px;color:var(--gris)}
.var.abierta{background:var(--lado)}
.num-esc{display:flex;gap:6px}.num-esc .entrada{width:110px;height:32px}
.num-esc .btn,.confirma .btn{height:32px;padding:0 12px;font-size:13px}
.confirma{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (max-width:560px){.var{grid-template-columns:minmax(0,1fr) auto}.var-ctrl{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<header class="barra" id="barra"></header>
<main id="app"></main>
<footer class="pie-fijo"><b>Gradiox Gateway</b><span id="pie-version"></span></footer>
<script>
const I = {
  empresa:'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/>',
  sitio:'<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  cable:'<path d="M17 21v-2a1 1 0 0 1-1-1v-1a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1"/><path d="M19 15V6.5a1 1 0 0 0-7 0v11a1 1 0 0 1-7 0V9"/><path d="M21 21v-2h-4"/><path d="M3 5h4V3"/><path d="M7 5a1 1 0 0 1 1 1v1a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1V3"/>',
  red:'<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
  ok:'<path d="M20 6 9 17l-5-5"/>',
  alerta:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  flecha:'<path d="m9 18 6-6-6-6"/>',
  automata:'<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>',
  nube:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  disco:'<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>',
  inicio:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  lista:'<path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/>',
  equipos:'<path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/>',
  ordenes:'<path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 12 16 8"/><path d="M12 7v1"/>',
  ordenador:'<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/>',
  rayo:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  enlace:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  candado:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  matraz:'<path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/>',
  reloj:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>'
};
const CLAVE = "{{CLAVE}}";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pl = (n, uno, varios) => (Number(n) === 1 ? uno : varios);
const num = (x) => Number(x).toLocaleString("es-ES", { maximumFractionDigits: 2 });
const ic = (n, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ${extra}>${I[n]}</svg>`;
const giro = '<span class="giro" style="margin-top:2px;color:var(--acento)"></span>';
const guardar = (k, v) => { try { localStorage.setItem("gx-" + k, v); } catch {} };
const leer = (k) => { try { return localStorage.getItem("gx-" + k); } catch { return null; } };

async function pedir(ruta, cuerpo) {
  const r = await fetch(ruta, { method: cuerpo === undefined ? "GET" : "POST", headers: { "X-Gradiox-Clave": CLAVE, "Content-Type": "application/json" }, body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo) });
  if (!r.ok) throw new Error((await r.text().catch(() => "")).trim() || "No se ha podido completar.");
  return r.json();
}
function valor(v) {
  if (v.x === null || v.x === undefined) return "—";
  if (typeof v.x === "boolean") return v.x ? "Sí" : "No";
  if (typeof v.x === "number") return num(v.x) + (v.u && v.u !== "sí/no" ? " " + v.u : "");
  return String(v.x);
}
const hace = (t, ahora) => {
  if (!t) return "";
  const s = Math.max(0, Math.round((ahora - t) / 1000));
  return s < 5 ? "ahora" : s < 90 ? `hace ${s} s` : s < 5400 ? `hace ${Math.round(s / 60)} min` : `hace ${Math.round(s / 3600)} h`;
};

/* ---------- Estado de la página ---------- */
let E = null; // lo que cuenta el programa (/api/estado)
let B = null; // última búsqueda de variables en el autómata
const U = {
  vista: null, paso: 1, seccion: "resumen", cerrado: false, actualizando: false,
  f: null, probando: false, resultado: null,
  codigo: "", vinculando: false, codigoError: "", token: false,
  buscando: false, errorBusqueda: "", explorar: false, filtro: "todas", busca: "", abiertos: new Set(), marcas: null, eligiendo: false, errorElegir: "", volverPanel: false,
  pv: { busca: "", nuevos: {}, volver: "5", confirmar: null, escribiendo: "", ultimo: null, error: "", errorDe: "", abierta: "" },
  confirmar: "", info: false, abiertosDet: new Set(),
};
const H = {}; // historial de valores para las gráficas de cada variable

/* ---------- Cabecera y pie ---------- */
function estadoGeneral() {
  const p = E.plc, n = E.nube, c = E.config;
  if (c.simulado) return ["acento", "Modo demostración"];
  if (p.estado !== "conectado") return ["mal", "Sin conexión con el autómata"];
  if (!c.hayToken) return ["aviso", "Sin vincular"];
  if (n.estado === "sin-permiso") return ["mal", "Acceso a Gradiox revocado"];
  if (n.estado === "error") return ["aviso", "Envío interrumpido"];
  return ["bien", "En servicio"];
}
function barra() {
  const vinc = E && E.config.hayToken && E.instalacion;
  const quien = vinc
    ? `<div class="quien">${E.cliente ? `<b>${ic("empresa")}${esc(E.cliente)}</b><span>${ic("sitio")}${esc(E.instalacion)}</span>` : `<b>${ic("sitio")}${esc(E.instalacion)}</b><span>Instalación vinculada</span>`}</div>`
    : `<div class="quien"><b style="color:var(--gris);font-weight:550">Sin vincular</b><span>Sin instalación de destino</span></div>`;
  let pastilla = "";
  if (E && U.vista === "panel") { const [t, x] = estadoGeneral(); pastilla = `<span class="pastilla ${t}" title="${x}" role="status">${x}</span>`; }
  else if (E) pastilla = '<span class="pastilla acento sin">Puesta en marcha</span>';
  const info = U.info && E ? `<div class="info-pop" role="dialog" aria-label="Gradiox Gateway"><dl><div><dt>Protocolos</dt><dd>OPC UA · Modbus TCP (próximamente)</dd></div><div><dt>Destino</dt><dd>Plataforma Gradiox (TLS)</dd></div><div><dt>Modo</dt><dd>Lectura · órdenes con autorización</dd></div><div><dt>Versión</dt><dd>${esc(E.version)} · ${esc(E.plataforma || "")}</dd></div></dl></div>` : "";
  $("#barra").innerHTML = `<span class="marca">gradi<i></i>x</span><span class="producto">Gateway<small>Pasarela industrial <button class="info-btn" data-a="info" aria-expanded="${U.info}" aria-label="Más información">${ic("info")}</button></small></span>${info}<span class="sep"></span>${quien}<span class="hueco"></span>${pastilla}`;
  $("#pie-version").textContent = E ? "Pasarela industrial · versión " + E.version : "Pasarela industrial";
}

/* ---------- Asistente ---------- */
const PASOS = [["Vinculación"], ["Autómata"], ["Variables"], ["Verificación"]];
function pasoInicial() {
  const c = E.config, p = E.plc;
  if (!c.hayToken && leer("sin-vincular") !== "1") return 1;
  // Sin dirección propia ni modo demostración, el primer paso que falta es decir dónde está el autómata.
  if (!c.plc && !c.simulado) return 2;
  if (c.simulado || p.estado !== "conectado") return (p.estado === "error" && /^No hay lista/.test(p.detalle || "")) ? 3 : 2;
  if (!p.leidas) return 3;
  return 4;
}
function asistente() {
  const lista = PASOS.map((p, i) => {
    const n = i + 1, cls = n === U.paso ? "ahora" : n < U.paso ? "hecho" : "";
    return `<li class="${cls}"><span class="n">${n < U.paso ? ic("ok", 'width="13" height="13" stroke-width="3"') : n}</span><span class="t">${p[0]}</span></li>`;
  }).join("");
  const cuerpo = [null, paso1, paso2, paso3, paso4][U.paso]();
  const salir = leer("terminado") === "1" ? `<li class="ayuda-pasos"><button class="enlace" data-a="aPanel">Volver al panel</button></li>` : `<li class="ayuda-pasos">Un paso cada vez. Si algo falla, la pasarela indica cómo resolverlo.</li>`;
  return `<div class="asistente"><ol class="pasos">${lista}${salir}</ol><section class="paso">${cuerpo}</section></div>`;
}
const cabPaso = (titulo, intro) => `<div class="eyebrow">Paso ${U.paso} de 4</div><h1>${titulo}</h1><p class="intro">${intro}</p>`;

function paso1() {
  const c = E.config;
  if (c.hayToken && !U.token) {
    const sinPermiso = E.nube.estado === "sin-permiso";
    return cabPaso("Vinculación", sinPermiso ? "El acceso de esta pasarela ya no es válido. Vincúlela de nuevo con un código de conexión." : "Pasarela vinculada. Las lecturas se enviarán a esta instalación.") + `
      <div class="bloque">
        ${sinPermiso ? `<div class="aviso mal">${ic("alerta")}<div class="cuerpo"><b>Acceso revocado</b><p>${esc(E.nube.detalle || "")}</p></div></div>` : `<div class="aviso bien">${ic("ok")}<div class="cuerpo"><b>${E.instalacion ? "Vinculada a " + esc(E.instalacion) : "Vinculada"}</b><p>${E.cliente ? "Cliente <b style=\"display:inline;color:var(--tinta)\">" + esc(E.cliente) + "</b>. " : ""}${E.instalacion ? "Configuración recibida de la plataforma." : "Recibiendo la configuración de la plataforma…"}</p></div></div>`}
        <p class="nota">¿Instalación incorrecta? <button class="enlace" data-a="otroCodigo">Introducir otro código</button></p>
      </div>
      <div class="pie-paso"><button class="btn prim grande" data-a="ir" data-p="2">Continuar</button></div>`;
  }
  if (U.token) {
    return cabPaso("Vinculación", "Pegue el token de acceso de la instalación. Solo para instalaciones creadas antes de los códigos de conexión.") + `
      <div class="bloque">
        <div class="campo"><label for="token">Token de acceso</label><input id="token" class="entrada mono" type="password" autocomplete="off" spellcheck="false" placeholder="gxp_…"></div>
        ${U.codigoError ? `<div class="aviso mal">${ic("alerta")}<div class="cuerpo"><b>${esc(U.codigoError)}</b></div></div>` : ""}
      </div>
      <div class="pie-paso"><button class="btn prim grande" data-a="ponerToken">Guardar</button><button class="btn fant" data-a="usarCodigo">Usar código de conexión</button></div>`;
  }
  return cabPaso("Vinculación", "Introduzca el código de conexión de 6 cifras facilitado por Gradiox. Es de un solo uso y caduca a los 30 minutos.") + `
    <div class="bloque">
      <div class="campo">
        <label for="codigo">Código de conexión</label>
        <input id="codigo" class="entrada codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000" value="${esc(U.codigo)}">
      </div>
      ${U.codigoError ? `<div class="aviso mal">${ic("alerta")}<div class="cuerpo"><b>${esc(U.codigoError)}</b><p>Si ha caducado, solicite un código nuevo a Gradiox. Cada código nuevo anula el anterior.</p></div></div>` : ""}
      <details class="mas" data-k="sininternet" ${U.abiertosDet.has("sininternet") ? "open" : ""}><summary>¿Equipo sin acceso a internet?</summary><div class="nota" style="max-width:58ch">Puede configurar el autómata y las variables antes de vincular. Las lecturas se conservan en este equipo y se envían al completar la vinculación. <button class="enlace" data-a="saltar">Continuar sin vincular</button></div></details>
    </div>
    <div class="pie-paso">
      <button class="btn prim grande" data-a="vincular" ${U.vinculando ? "disabled" : ""}>${U.vinculando ? '<span class="giro"></span> Comprobando' : "Vincular"}</button>
      <button class="btn fant" data-a="usarToken">Usar token de acceso</button>
    </div>`;
}

function camposIniciales() {
  const c = E.config;
  let dir = (c.plc || "").replace(/^opc\.tcp:\/\//, ""), puerto = "4840";
  const m = dir.match(/^(.*):(\d+)$/);
  if (m) { dir = m[1]; puerto = m[2]; }
  return { cable: leer("cable") || "directo", dir, puerto, pideClave: !!c.usuario, usuario: c.usuario || "", clave: "", seguridad: c.seguridad || "auto", cada: String(c.cadaSegundos || c.cadaVigente || 10) };
}
function paso2() {
  const f = U.f || (U.f = camposIniciales());
  const r = U.resultado;
  let resultado = "";
  if (U.probando) resultado = `<div class="aviso">${giro}<div class="cuerpo"><b>Conectando con ${esc(f.dir)}…</b><p>Puede tardar unos segundos.</p></div></div>`;
  else if (r && r.ok) resultado = `<div class="aviso bien">${ic("ok")}<div class="cuerpo"><b>Conexión correcta</b><p>${esc(r.texto)}</p></div></div>`;
  else if (r && r.clave) resultado = `<div class="aviso ambar">${ic("candado")}<div class="cuerpo"><b>El autómata requiere usuario y contraseña</b><p>${esc(r.texto)} Las credenciales se guardan solo en este equipo y no se envían a Gradiox.</p></div></div>`;
  else if (r && r.red) resultado = `<div class="aviso ambar">${ic("alerta")}<div class="cuerpo"><b>Este equipo no está en la red del autómata</b><p>${esc(r.texto)}</p><div class="fila"><button class="btn" data-a="probar">Volver a probar</button></div></div></div>`;
  else if (r) resultado = `<div class="aviso mal">${ic("alerta")}<div class="cuerpo"><b>Sin conexión con el autómata</b><p>${esc(r.texto)}</p><p style="margin-top:8px">Compruebe, por este orden: la dirección IP del autómata, el cable de red y la actividad del puerto, y que el servidor OPC UA está activado en el autómata.</p><div class="fila"><button class="btn" data-a="probar">Volver a probar</button></div></div></div>`;
  const ok = r && r.ok;
  return cabPaso("Conexión con el autómata", "Configure el acceso al autómata (PLC). La pasarela funciona en modo lectura; la escritura requiere una autorización expresa.") + `
    <div class="bloque">
      <div class="campo"><label>Tipo de conexión</label>
        <div class="opciones">
          <button class="opcion" aria-pressed="${f.cable === "directo"}" data-a="cable" data-v="directo">${ic("cable")}<div><b>Conexión directa</b><span>Cable de red entre este equipo y el autómata. El acceso a internet, por wifi o datos móviles.</span></div></button>
          <button class="opcion" aria-pressed="${f.cable === "red"}" data-a="cable" data-v="red">${ic("red")}<div><b>Red de la planta</b><span>Equipo y autómata en la misma red local.</span></div></button>
        </div>
      </div>
      <div class="campo"><label for="dir">Dirección IP del autómata</label>
        <input id="dir" class="entrada mono" value="${esc(f.dir)}" placeholder="${esc((E.config.plcVigente || "").replace(/^opc\.tcp:\/\//, "").replace(/:4840$/, "") || "192.168.0.1")}" spellcheck="false" autocomplete="off">
        <small>Por ejemplo, 192.168.0.1.</small>
      </div>
      <label class="interruptor"><input type="checkbox" id="pideClave" ${f.pideClave ? "checked" : ""}><div><b>Requiere autenticación</b><span>Si no lo sabe, déjelo desactivado: la pasarela lo detecta.</span></div></label>
      ${f.pideClave ? `<div class="rejilla2"><div class="campo"><label for="usuario">Usuario del autómata</label><input id="usuario" class="entrada" value="${esc(f.usuario)}" autocomplete="off" spellcheck="false"></div><div class="campo"><label for="clave">Contraseña</label><input id="clave" class="entrada" type="password" value="${esc(f.clave)}" placeholder="${E.config.hayClave ? "Guardada. Escriba para cambiarla" : ""}" autocomplete="new-password"></div></div>` : ""}
      <details class="mas" data-k="avanzadas" ${U.abiertosDet.has("avanzadas") ? "open" : ""}><summary>Opciones avanzadas</summary><div class="rejilla2">
        <div class="campo"><label for="seguridad">Seguridad</label><select id="seguridad" class="entrada">${[["auto", "Automática (recomendado)"], ["cifrada", "Cifrada"], ["ninguna", "Sin cifrar"]].map(([k, t]) => `<option value="${k}" ${f.seguridad === k ? "selected" : ""}>${t}</option>`).join("")}</select></div>

function vigenteBusqueda(r) {
  const c = E.config;

async function buscarVariables(forzar) {
  U.buscando = true; U.errorBusqueda = ""; pintar();
  try {
    let r = forzar ? { hay: false } : await pedir("/api/exploracion");
    // Una búsqueda guardada solo vale si es de este mismo autómata y reciente:
    // la de otra visita enseñaría variables que aquí no existen.

}

// Árbol de lo que publica el autómata, por su ruta («PLC_1 / Datos / TT9»). Los elementos de un array («X[3]») cuelgan de su array.
let ARBOL = null;
function armarArbol() {
  const raiz = { k: "", nom: "", hijos: new Map(), fila: null };
  const filas = B.variables;
  const partes = filas.map((f) => f.ruta.split(" / "));
  // Lo que comparten todas (p. ej. «ServerInterfaces / PLC_1») no aporta: se quita.
  let comun = 0;
  if (partes.length > 1) while (partes.every((p) => p.length > comun + 1 && p[comun] === partes[0][comun])) comun++;
  const porRuta = new Map();
  filas.forEach((f, i) => {
    let segs = partes[i].slice(comun);
    const m = segs[segs.length - 1].match(/^(.*)\[(\d+)\]$/);
    if (m && porRuta.has(f.ruta.replace(/\[\d+\]$/, ""))) segs = [...segs.slice(0, -1), m[1], segs[segs.length - 1]];
    let nodo = raiz, k = "";
    for (const s of segs) {
      k += "/" + s;
      if (!nodo.hijos.has(s)) nodo.hijos.set(s, { k, nom: s, hijos: new Map(), fila: null });
      nodo = nodo.hijos.get(s);
    }
    nodo.fila = f;
    porRuta.set(f.ruta, nodo);
  });
  ARBOL = raiz;
  if (raiz.hijos.size <= 4) for (const h of raiz.hijos.values()) U.abiertos.add(h.k);
}
function hojas(nodo, out = []) {
  if (nodo.fila && !nodo.fila.bloqueo) out.push(nodo.fila);
  for (const h of nodo.hijos.values()) hojas(h, out);
  return out;
}
function filaHtml(f, sangria, nombre) {
  const tipo = /^Lista de/.test(f.tipo || "") ? `array · ${esc(f.tipo.replace("Lista de ", ""))} posiciones` : f.tipo === "Estructura" ? "estructura" : "";

  const v = f.bloqueo ? "" : valor(f);
  return `<div class="nodo" style="padding-left:${12 + sangria * 22}px"><span></span><input type="checkbox" data-a="marca" data-v="${esc(f.nodo)}" ${U.marcas.has(f.nodo) ? "checked" : ""} ${f.bloqueo ? "disabled" : ""} aria-label="Leer ${esc(f.n)}"><div class="nom"><b>${titulo}${f.p ? '<span class="etq">recomendada</span>' : ""}${tipo ? `<span class="etq gris">${tipo}</span>` : ""}</b><code>${esc(f.n)}</code>${f.bloqueo ? `<span class="det">${esc(f.bloqueo)}</span>` : ""}</div><span class="val">${esc(v)}</span></div>`;
}
const TOPE = 400;
function arbolHtml() {
  const q = U.busca.trim().toLowerCase();
  if (q || U.filtro !== "todas") {
    const lista = B.variables.filter((f) => (U.filtro === "rec" ? f.p : U.filtro === "marcadas" ? U.marcas.has(f.nodo) : true) && (!q || (f.n + " " + (f.d || "") + " " + f.ruta).toLowerCase().includes(q)));

  }

      html += `<div class="nodo carpeta" style="padding-left:${12 + sangria * 22}px"><button class="ab" aria-expanded="${abierto}" data-a="abrir" data-v="${esc(h.k)}" aria-label="Desplegar ${esc(h.nom)}">${ic("flecha")}</button><input type="checkbox" data-a="todo" data-v="${esc(h.k)}" ${todas.length && n === todas.length ? "checked" : ""} ${todas.length ? "" : "disabled"} aria-label="Marcar todo ${esc(h.nom)}"><div class="nom"><b>${esc(f && f.d ? f.d : h.nom)}${etq}</b>${f ? `<code>${esc(f.n)}</code>` : ""}</div><span class="val nota">${todas.length ? `${n} de ${todas.length}` : ""}</span></div>`;

  };
  pintarNodo(ARBOL, 0);
  return html || `<p class="nota" style="padding:14px">El autómata no publica variables legibles.</p>`;
}
function nodoPorClave(k) {
  let n = ARBOL;

    return;
  }
  if (!E) { app.innerHTML = `<div class="asistente" style="display:block"><p class="nota">Cargando…</p></div>`; return; }
  // Se conserva el desplazamiento de las listas largas y el foco al volver a pintar.
  const desp = {}; document.querySelectorAll("[data-desp]").forEach((el) => { desp[el.dataset.desp] = el.scrollTop; });
  const foco = document.activeElement && document.activeElement.id, sel = foco && document.activeElement.selectionStart;
  app.innerHTML = U.vista === "panel" ? panel() : asistente();
  document.querySelectorAll(".arbol").forEach((el) => el.dataset.desp = "arbol");
  document.querySelectorAll(".pv-scroll").forEach((el) => el.dataset.desp = "pv");
  document.querySelectorAll("[data-desp]").forEach((el) => { if (desp[el.dataset.desp]) el.scrollTop = desp[el.dataset.desp]; });
  if (foco) { const el = document.getElementById(foco); if (el) { el.focus(); try { if (sel !== null && sel !== undefined) el.setSelectionRange(sel, sel); } catch {} } }
}

const escribiendo = () => { const a = document.activeElement; return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== "checkbox" && a.closest("#app"); };

async function refrescar() {
  try {
    const e = await pedir("/api/estado");
    E = e; U.cerrado = false;
    if (U.actualizando && !(e.actualizacion || {}).enCurso && !(e.actualizacion || {}).nueva) U.actualizando = false;
    if (U.vista === null) {
      const enMarcha = e.config.hayToken && e.plc.estado === "conectado" && e.plc.leidas > 0 && !e.config.simulado;
      U.vista = leer("terminado") === "1" || enMarcha ? "panel" : "asistente";
      if (U.vista === "asistente") U.paso = pasoInicial();
      if (e.busqueda) pedir("/api/exploracion").then((r) => { if (r.hay && !B && vigenteBusqueda(r)) { B = r; armarArbol(); } }).catch(() => {});
    }
    const ahora = Date.now();
    for (const v of e.variables) if (typeof v.x === "number" && v.t) {
      const h = (H[v.n] = H[v.n] || []);
      if (!h.length || h[h.length - 1][0] !== v.t) h.push([v.t, v.x]);
      while (h.length && ahora - h[0][0] > 10 * 60_000) h.shift();
    }
    if (!escribiendo()) pintar(); else barra();
  } catch {
    U.cerrado = true; pintar();
  }
}

        E = await pedir("/api/estado");
        const p = E.plc;
        if (p.estado === "conectado" && p.direccion && p.direccion.includes(f.dir)) { fin = { ok: true, texto: `${p.direccion.replace(/^opc\.tcp:\/\//, "")} · conexión ${p.seguridad || ""}.` }; break; }
        if (p.estado === "error" && !/^No hay lista/.test(p.detalle || "")) { fin = { texto: p.detalle || "Sin respuesta." }; break; }
        if (p.estado === "error") break;
        await new Promise((r) => setTimeout(r, 1500));
      }
    }
    if (!fin) {
      // Sin lista que leer, la prueba es buscar las variables: así además quedan listas para el paso siguiente.
      const r = await pedir("/api/explorar", {});
      if (r.error) fin = { texto: r.error };
      else { B = r; U.marcas = null; armarArbol(); fin = { ok: true, texto: `${r.variables.length} variables disponibles.` }; }
    }
    if (!fin.ok) {
      if (/usuario|contrase|autentic|identidad|Identity|User/i.test(fin.texto)) { fin.clave = true; f.pideClave = true; }
      else if (/no está en la red/i.test(fin.texto)) fin.red = true;
    }
    guardar("cable", f.cable);
    U.resultado = fin;
  } catch (e) { U.resultado = { texto: e.message || "No se ha podido guardar." }; }
  U.probando = false; pintar();
}
async function vincular() {
  const cod = (U.codigo || "").replace(/\D/g, "");
  if (cod.length !== 6) { U.codigoError = "El código de conexión tiene 6 cifras."; pintar(); return; }
  U.codigoError = ""; U.vinculando = true; pintar();
  try {
    const r = await pedir("/api/vincular", { codigo: cod });
    if (r.error) U.codigoError = r.error;
    else { E = r.estado; U.codigo = ""; guardar("sin-vincular", "0"); }
  } catch (e) { U.codigoError = e.message; }
  U.vinculando = false; pintar();
}
async function elegir() {
  U.eligiendo = true; U.errorElegir = ""; pintar();
  try {
    const r = await pedir("/api/elegir", { nodos: [...U.marcas] });
    if (r.error) { U.errorElegir = r.error; }
    else {
      U.explorar = false;
      if (U.volverPanel) { U.volverPanel = false; U.vista = "panel"; U.seccion = "variables"; }
      else U.paso = 4;
      await refrescar();
    }
  } catch (e) { U.errorElegir = e.message; }
  U.eligiendo = false; pintar();
}
async function escribirValor(n, valor, volver, restaurar = false) {
  const P = U.pv;
  P.escribiendo = n; P.confirmar = null; P.error = ""; pintar();
  try {
    const r = await pedir("/api/escribir", restaurar ? { n, restaurar: true } : { n, valor, volver: parseInt(volver, 10) || 0 });
    if (r.error) P.ultimo = { n, estado: "rechazada", motivo: r.error };
    else P.ultimo = { n, estado: r.estado, motivo: r.motivo, antes: r.antes, leido: r.leido, restaurado: restaurar, t: Date.now() };
    if (r.estado === "hecha") delete P.nuevos[n];
  } catch (e) { P.ultimo = { n, estado: "rechazada", motivo: e.message }; }
  P.escribiendo = "";
  await refrescar();
}

document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-a]");
  if (!b) { if (U.info && !ev.target.closest(".info-pop")) { U.info = false; barra(); } return; }
  if (b.tagName === "INPUT") return; // las casillas van por «change»
  const a = b.dataset.a, v = b.dataset.v;
  switch (a) {
    case "info": U.info = !U.info; barra(); return;
    case "ir": leerCampos(); U.paso = +b.dataset.p; U.resultado = U.paso === 2 ? U.resultado : U.resultado; break;
    case "aPaso": U.vista = "asistente"; U.paso = +b.dataset.p; U.f = null; U.resultado = null; U.token = false; break;
    case "aPanel": U.vista = "panel"; U.volverPanel = false; U.explorar = false; break;
    case "vincular": await vincular(); return;
    case "usarToken": U.token = true; U.codigoError = ""; break;
    case "usarCodigo": U.token = false; U.codigoError = ""; break;
    case "ponerToken": {
      const t = ($("#token")?.value || "").trim();
      if (!t) { U.codigoError = "Pegue el token."; break; }
      try { await guardarConfig({ token: t }); U.token = false; U.codigoError = ""; guardar("sin-vincular", "0"); } catch (e) { U.codigoError = e.message; }
      break;
    }
    case "otroCodigo": U.token = false; try { await guardarConfig({ token: "" }); } catch {} break;
    case "saltar": guardar("sin-vincular", "1"); U.paso = 2; break;
    case "cable": leerCampos(); U.f.cable = v; break;
    case "probar": await probarConexion(); return;
    case "demo": try { await guardarConfig({ simulado: true }); U.resultado = { ok: true, texto: "Modo demostración: autómata simulado con valores de ejemplo." }; B = null; U.marcas = null; } catch (e) { U.resultado = { texto: e.message }; } break;
    case "buscar": B = null; U.marcas = null; await buscarVariables(true); return;
    case "explorar": U.explorar = true; break;
    case "cerrarExplorar": U.explorar = false; break;
    case "filtro": U.filtro = v; break;
    case "abrir": U.abiertos.has(v) ? U.abiertos.delete(v) : U.abiertos.add(v); break;
    case "marcarRec": U.marcas = new Set(recomendadas().map((f) => f.nodo)); break;
    case "leer": await elegir(); return;
    case "finalizar": guardar("terminado", "1"); U.vista = "panel"; U.seccion = "resumen"; break;
    case "sec": U.seccion = v; U.confirmar = ""; break;
    case "cambiarLista": U.vista = "asistente"; U.paso = 3; U.explorar = true; U.volverPanel = true; U.marcas = null; if (!B) { buscarVariables(); return; } break;
    case "volverLista": try { await pedir("/api/elegir", { quitar: true }); B = null; } catch {} await refrescar(); return;
    case "confirmar": U.confirmar = v; break;
    case "noConfirmar": U.confirmar = ""; break;
    case "autorizar": U.confirmar = ""; try { await guardarConfig({ ordenes: true }); } catch {} break;
    case "revocar": try { await guardarConfig({ ordenes: false }); } catch {} break;
    case "actualizar": U.actualizando = true; try { await pedir("/api/actualizar", {}); } catch {} break;
    case "buscarVersion": try { await pedir("/api/actualizar", {}); } catch {} setTimeout(refrescar, 2500); break;
    case "carpeta": pedir("/api/carpeta", {}).catch(() => {}); return;
    case "desvincular": U.confirmar = ""; try { await guardarConfig({ token: "" }); } catch {} break;
    case "cerrar": U.confirmar = ""; try { await pedir("/api/cerrar", {}); } catch {} U.cerrado = true; break;
    case "pvAbrir": U.pv.abierta = U.pv.abierta === v ? "" : v; break;
    case "pvBool": {
      const n = b.dataset.n, vv = E.variables.find((x) => x.n === n);
      if (vv && vv.x === (v === "1")) break;
      Object.assign(U.pv, { confirmar: { n, x: v === "1", txt: v === "1" ? "Sí" : "No" }, error: "" });
      break;
    }
    case "pvEscribir": {
      const P = U.pv, n = b.dataset.n, e = (E.escribiblesLista || []).find((x) => x.n === n || corto(x.n) === corto(n)), vv = E.variables.find((x) => x.n === n);
      P.error = ""; P.errorDe = n;
      if (!e || !vv) break;
      const x = parseFloat(String(P.nuevos[n] || "").replace(",", "."));
      if (!isFinite(x)) { P.error = "Escriba un número."; break; }
      if ((e.min !== undefined && x < e.min) || (e.max !== undefined && x > e.max)) { P.error = `Fuera de rango: entre ${num(e.min)} y ${num(e.max)}.`; break; }
      P.confirmar = { n, x, txt: fmt(x, vv) };
      break;
    }
    case "pvNo": U.pv.confirmar = null; break;
    case "pvSi": { const c = U.pv.confirmar; await escribirValor(c.n, c.x, U.pv.volver); return; }
    case "pvRestaurar": await escribirValor(b.dataset.n, null, "0", true); return;
    default: return;
  }
  pintar();
});
document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.id === "pideClave") { leerCampos(); U.f.pideClave = t.checked; pintar(); return; }
  if (t.id === "pvolver") { U.pv.volver = t.value; return; }
  if (t.id === "permitirOrdenes") {
    const activo = t.checked;
    try { await guardarConfig({ ordenes: activo }); } catch { t.checked = !activo; }
    return;
  }
  if (t.id === "arranque") {
    const activo = t.checked;
    try { await pedir("/api/arranque", { activo }); } catch (e) { t.checked = !activo; const n = $("#arranque-nota"); if (n) n.textContent = e.message; }
    return;
  }
  const a = t.dataset.a, v = t.dataset.v;
  if (a === "marca") t.checked ? U.marcas.add(v) : U.marcas.delete(v);
  else if (a === "todo") { const n = nodoPorClave(v); if (n) for (const f of hojas(n)) t.checked ? U.marcas.add(f.nodo) : U.marcas.delete(f.nodo); }
  else return;
  pintar();
});
document.addEventListener("toggle", (ev) => {
  const d = ev.target;
  if (d.tagName === "DETAILS" && d.dataset.k) d.open ? U.abiertosDet.add(d.dataset.k) : U.abiertosDet.delete(d.dataset.k);
}, true);
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "codigo") { const d = t.value.replace(/\D/g, "").slice(0, 6); t.value = d.length > 3 ? d.slice(0, 3) + " " + d.slice(3) : d; U.codigo = d; return; }
  if (t.id === "busca") { U.busca = t.value; const ar = $("#arbol"); if (ar) ar.innerHTML = arbolHtml(); return; }
  if (t.dataset && t.dataset.pv) { U.pv.nuevos[t.dataset.pv] = t.value; return; }
  if (t.id === "pvbusca") { U.pv.busca = t.value; pintar(); return; }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter") return;
  if (ev.target.id === "codigo") vincular();
  if (ev.target.id === "dir") probarConexion();
  if (ev.target.dataset && ev.target.dataset.pv) { const bt = ev.target.parentElement.querySelector("[data-a=pvEscribir]"); if (bt) bt.click(); }
});

refrescar();
setInterval(refrescar, 2000);
</script>
